<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pure Aqua — Fresh water, on time</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .splash-shell {
    background: linear-gradient(170deg, var(--ocean-900), var(--ocean-700) 60%, var(--aqua-500));
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; padding: 30px;
  }
  .splash-logo { width: 84px; height: 84px; margin-bottom: 18px; }
  .splash-shell h1 { color: #fff; font-size: 28px; }
  .splash-shell p.tag { color: rgba(255,255,255,0.75); margin-top: 8px; font-size: 14px; }
  .loader {
    width: 140px; height: 56px; margin-top: 34px;
    border: 2px solid rgba(255,255,255,0.35); border-radius: 999px;
    position: relative; overflow: hidden;
  }
  .loader .fill {
    position: absolute; left: 0; bottom: 0; top: 0; width: 0%;
    background: rgba(255,255,255,0.85);
    animation: fillUp 1.8s ease-in-out forwards;
    border-radius: 999px;
  }
  @keyframes fillUp { from { width: 0%; } to { width: 100%; } }
  .loader span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: var(--ocean-900); z-index: 2;
  }
  .get-started { margin-top: 30px; width: 220px; }
  @media (prefers-reduced-motion: reduce) { .loader .fill { animation: none; width: 100%; } }
</style>
</head>
<body>
<div class="app-shell splash-shell">
  <svg class="splash-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 6C32 6 12 30 12 43a20 20 0 0040 0C52 30 32 6 32 6Z" fill="#fff" fill-opacity="0.95"/>
    <path d="M32 6C32 6 12 30 12 43a20 20 0 0040 0C52 30 32 6 32 6Z" stroke="#0B3D5C" stroke-width="1.5"/>
  </svg>
  <h1>Pure Aqua</h1>
  <p class="tamil">சுத்தமான தண்ணீர், சரியான நேரத்தில்</p>
  <p class="tag">Fresh drinking water, delivered on time</p>

  <div class="loader" role="status" aria-label="Loading">
    <div class="fill"></div>
    <span>LOADING…</span>
  </div>

  <a href="login.html" class="btn btn-amber get-started" style="display:none;" id="manualBtn">Get Started</a>
</div>

<script src="js/app.js"></script>
<script>
  // Auto-advance after the loader animation; show a manual button as a fallback.
  setTimeout(() => {
    var hasSession = !!localStorage.getItem('pa_session_v1');
    window.location.href = hasSession ? 'home.html' : 'login.html';
  }, 2000);
  setTimeout(() => { document.getElementById('manualBtn').style.display = 'inline-flex'; }, 3500);
</script>
</body>
</html>
