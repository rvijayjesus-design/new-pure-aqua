<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile — Pure Aqua</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" style="padding-bottom:24px;">
    <div class="eyebrow">MY ACCOUNT</div>
    <h1 data-user-name>Profile</h1>
    <p class="tamil" style="color:rgba(255,255,255,0.75)">சுயவிவரம்</p>
    <svg class="wave-edge" viewBox="0 0 500 30" preserveAspectRatio="none"><path d="M0 15 Q125 0 250 15 T500 15 V30 H0 Z" fill="#F4FAFB"/></svg>
  </header>

  <main class="app-main" style="padding-top:16px;">
    <form id="profileForm" class="stack">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name">
      </div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" disabled>
      </div>
      <div class="field">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>

    <hr class="divider">

    <a href="about.html" class="card-row card" style="text-decoration:none;">
      <span>About Pure Aqua</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mist-500)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a href="contact.html" class="card-row card" style="text-decoration:none;">
      <span>Contact & support</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mist-500)" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <button class="btn btn-danger" id="logoutBtn" style="margin-top:8px;">Log out</button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s7 8 7 13a7 7 0 11-14 0c0-5 7-13 7-13z"/></svg>Book</a>
    <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>Orders</a>
    <a href="wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>Wallet</a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>
</div>

<script src="js/app.js"></script>
<script>
  PureAqua.requireAuth();
  const user = PureAqua.currentUser();
  document.getElementById('name').value = user.name;
  document.getElementById('phone').value = user.phone;
  document.getElementById('address').value = user.address || '';

  document.getElementById('profileForm').addEventListener('submit', function (e) {
    e.preventDefault();
    PureAqua.updateProfile({
      name: document.getElementById('name').value.trim(),
      address: document.getElementById('address').value.trim(),
    });
    paToast('Profile updated');
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    PureAqua.logout();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
