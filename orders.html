<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orders — Pure Aqua</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" style="padding-bottom:24px;">
    <div class="eyebrow">TRACK & HISTORY</div>
    <h1>Your orders</h1>
    <p class="tamil" style="color:rgba(255,255,255,0.75)">உங்கள் ஆர்டர்கள்</p>
    <svg class="wave-edge" viewBox="0 0 500 30" preserveAspectRatio="none"><path d="M0 15 Q125 0 250 15 T500 15 V30 H0 Z" fill="#F4FAFB"/></svg>
  </header>

  <main class="app-main" style="padding-top:16px;">
    <div id="orderList" class="stack"></div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s7 8 7 13a7 7 0 11-14 0c0-5 7-13 7-13z"/></svg>Book</a>
    <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>Orders</a>
    <a href="wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>Wallet</a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>
</div>

<script src="js/app.js"></script>
<script>
  PureAqua.requireAuth();

  const STAGES = [
    { key: 'placed', label: 'Order placed' },
    { key: 'confirmed', label: 'Confirmed by vendor' },
    { key: 'out_for_delivery', label: 'Out for delivery' },
    { key: 'delivered', label: 'Delivered' },
  ];

  function render() {
    const orders = PureAqua.getOrders();
    orders.forEach(o => PureAqua.progressOrder(o.id));

    const list = document.getElementById('orderList');
    if (!orders.length) {
      list.innerHTML = '<div class="card empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>' +
        '<p>No orders yet.</p><a href="booking.html" class="btn btn-primary" style="margin-top:10px;">Book your first can</a></div>';
      return;
    }

    list.innerHTML = orders.map(o => {
      const idx = STAGES.findIndex(s => s.key === o.status);
      const timeline = STAGES.map((s, i) => `
        <li class="${i <= idx ? 'done' : ''}">
          <span class="dot"></span>
          <div><strong>${s.label}</strong>${i === idx ? `<span>${paTimeAgo(o.placedAt)}</span>` : ''}</div>
        </li>`).join('');
      return `
        <div class="card">
          <div class="row between">
            <strong>Order #${o.id}</strong>
            <span class="pill ${o.status === 'delivered' ? 'pill-success' : 'pill-pending'}">${o.status.replace(/_/g,' ')}</span>
          </div>
          <div class="muted" style="margin:4px 0 14px;">${o.canName} × ${o.qty} · ${paFormatMoney(o.total)} · ${o.slot}</div>
          <ul class="timeline">${timeline}</ul>
        </div>`;
    }).join('');
  }

  render();
  setInterval(render, 5000);
</script>
</body>
</html>
