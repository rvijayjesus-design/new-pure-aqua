<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book a can — Pure Aqua</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header" style="padding-bottom:24px;">
    <div class="eyebrow">NEW ORDER</div>
    <h1>Book a can</h1>
    <p class="tamil" style="color:rgba(255,255,255,0.75)">கேன் ஆர்டர் செய்யுங்கள்</p>
    <svg class="wave-edge" viewBox="0 0 500 30" preserveAspectRatio="none"><path d="M0 15 Q125 0 250 15 T500 15 V30 H0 Z" fill="#F4FAFB"/></svg>
  </header>

  <main class="app-main" style="padding-top:16px;">

    <h3 style="font-size:14px; margin-bottom:10px;">1. Choose your can</h3>
    <div id="canList"></div>

    <h3 style="font-size:14px; margin:20px 0 10px;">2. Quantity</h3>
    <div class="stepper">
      <button type="button" id="minus" aria-label="Decrease quantity">−</button>
      <span id="qty">1</span>
      <button type="button" id="plus" aria-label="Increase quantity">+</button>
    </div>

    <h3 style="font-size:14px; margin:20px 0 10px;">3. Delivery address</h3>
    <div class="field">
      <textarea id="address" rows="2" placeholder="House no, street, area"></textarea>
    </div>

    <h3 style="font-size:14px; margin:20px 0 10px;">4. Delivery slot</h3>
    <div class="field">
      <select id="slot">
        <option>Today, 2:00 PM – 4:00 PM</option>
        <option>Today, 4:00 PM – 6:00 PM</option>
        <option>Tomorrow, 8:00 AM – 10:00 AM</option>
        <option>Tomorrow, 10:00 AM – 12:00 PM</option>
      </select>
    </div>

    <div class="card" style="background:var(--foam-100); box-shadow:none;">
      <div class="card-row"><span class="muted">Item total</span><strong id="sumItem">₹0</strong></div>
      <hr class="divider">
      <div class="card-row"><span>Total</span><strong id="sumTotal" style="font-size:18px;">₹0</strong></div>
    </div>

    <button class="btn btn-primary" id="placeOrderBtn" style="margin-top:6px;">Place order</button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="booking.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s7 8 7 13a7 7 0 11-14 0c0-5 7-13 7-13z"/></svg>Book</a>
    <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>Orders</a>
    <a href="wallet.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>Wallet</a>
    <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </nav>
</div>

<script src="js/app.js"></script>
<script>
  PureAqua.requireAuth();
  const user = PureAqua.currentUser();
  document.getElementById('address').value = user.address || '';

  let selectedCan = PureAqua.CAN_CATALOG[0].id;
  let qty = 1;

  const icons = {
    drop: '<path d="M12 2s7 8 7 13a7 7 0 11-14 0c0-5 7-13 7-13z"/>',
    bottle: '<path d="M9 2h6v3l2 2v13a2 2 0 01-2 2H9a2 2 0 01-2-2V7l2-2V2z"/>',
  };

  function renderCans() {
    document.getElementById('canList').innerHTML = PureAqua.CAN_CATALOG.map(c => `
      <button type="button" class="can-card ${c.id === selectedCan ? 'selected' : ''}" data-id="${c.id}"
        style="width:100%; background:none; text-align:left; font-family:inherit;">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${icons[c.icon]}</svg></div>
        <div class="info"><strong>${c.name}</strong><span class="tamil">${c.tamil}</span></div>
        <div class="price">₹${c.price}</div>
      </button>`).join('');

    document.querySelectorAll('.can-card').forEach(el => {
      el.addEventListener('click', () => { selectedCan = el.dataset.id; renderCans(); updateSummary(); });
    });
  }

  function updateSummary() {
    const can = PureAqua.CAN_CATALOG.find(c => c.id === selectedCan);
    const total = can.price * qty;
    document.getElementById('qty').textContent = qty;
    document.getElementById('sumItem').textContent = paFormatMoney(total);
    document.getElementById('sumTotal').textContent = paFormatMoney(total);
  }

  document.getElementById('minus').addEventListener('click', () => { qty = Math.max(1, qty - 1); updateSummary(); });
  document.getElementById('plus').addEventListener('click', () => { qty = Math.min(20, qty + 1); updateSummary(); });

  document.getElementById('placeOrderBtn').addEventListener('click', () => {
    const address = document.getElementById('address').value.trim();
    if (!address) { paToast('Add a delivery address'); return; }
    const slot = document.getElementById('slot').value;
    const res = PureAqua.placeOrder({ canId: selectedCan, qty, address, slot });
    if (res.ok) {
      paToast('Order placed! ஆர்டர் வைக்கப்பட்டது');
      setTimeout(() => window.location.href = 'orders.html', 700);
    } else {
      paToast(res.error);
    }
  });

  renderCans();
  updateSummary();
</script>
</body>
</html>
