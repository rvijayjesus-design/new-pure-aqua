<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create account — Pure Aqua</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="eyebrow">PURE AQUA</div>
    <h1>Create your account</h1>
    <p class="tamil" style="color:rgba(255,255,255,0.75)">புதிய கணக்கு தொடங்குங்கள்</p>
    <svg class="wave-edge" viewBox="0 0 500 30" preserveAspectRatio="none"><path d="M0 15 Q125 0 250 15 T500 15 V30 H0 Z" fill="#F4FAFB"/></svg>
  </header>

  <main class="app-main" style="padding-top:26px;">
    <form id="regForm" class="stack" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" placeholder="98765 43210" inputmode="numeric" required>
        <div class="field-error" id="phoneErr">Enter a valid 10-digit number</div>
      </div>
      <div class="field">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="2" placeholder="House no, street, area"></textarea>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
        <div class="field-hint">You start with ₹100 wallet credit to try your first order.</div>
      </div>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="center-text muted" style="margin-top:18px;">
      Already have an account? <a href="login.html" class="link-inline">Login</a>
    </p>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  PureAqua.redirectIfAuthed('home.html');

  document.getElementById('regForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const password = document.getElementById('password').value;

    document.getElementById('phoneErr').style.display = 'none';
    if (!/^\d{10}$/.test(phone)) {
      document.getElementById('phoneErr').style.display = 'block';
      return;
    }
    if (!name || !password) { paToast('Fill in all required fields'); return; }

    const res = PureAqua.register({ name, phone, password, address });
    if (res.ok) {
      window.location.href = 'home.html';
    } else {
      paToast(res.error);
    }
  });
</script>
</body>
</html>
